<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="100%" height="100%">
  <defs>
    <!-- Define the bright highlight color for the text and icon -->
    <linearGradient id="textGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0d4"/>
    </linearGradient>

    <!-- Define the sparkle icon path (four-pointed star) -->
    <path id="sparkle" d="M 15 0 C 17 8, 22 13, 30 15 C 22 17, 17 22, 15 30 C 13 22, 8 17, 0 15 C 8 13, 13 8, 15 0 Z" />
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#060605" />

  <!-- Sparkle Icon with subtle glow -->
  <use href="#sparkle" x="25" y="25" fill="url(#textGlow)" filter="drop-shadow(0px 0px 2px rgba(255, 255, 255, 0.4))" />

  <!-- Handwritten Text -->
  <text x="85" y="55" 
        font-family="'Brush Script MT', 'Lucida Handwriting', 'Comic Sans MS', 'Apple Chancery', cursive" 
        font-weight="normal" 
        font-size="46" 
        fill="url(#textGlow)" 
        letter-spacing="0.5"
        filter="drop-shadow(0px 0px 2px rgba(255, 255, 255, 0.3))">
    AmirH Soukhteh
  </text>
</svg>
